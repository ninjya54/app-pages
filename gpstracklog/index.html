<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPSトラックログ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
        }

        .muted {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .links {
            margin-top: 40px;
        }

        .links a {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .links a:hover {
            background: #1557b0;
        }

        .links a.secondary {
            background: #f5f5f5;
            color: #333;
        }

        .links a.secondary:hover {
            background: #e8e8e8;
        }

        .note {
            margin-top: 32px;
            padding: 16px 20px;
            background: #f5f5f5;
            border-radius: 12px;
            text-align: left;
            font-size: 14px;
            color: #555;
        }

        .note code {
            font-size: 0.9em;
        }

        .back {
            margin-top: 40px;
        }

        .back a {
            color: #1a73e8;
        }
    </style>
</head>

<body>
    <h1>GPSトラックログ</h1>
    <p>iPhone で GPS 軌跡を記録し、GPX / KML で書き出せます。</p>
    <p class="muted">Bundle ID: <code>com.utsugumi.gpstracklog</code></p>

    <div class="links">
        <a href="version.json">version.json（アプリ用）</a>
        <a href="https://github.com/ninjya54/app-pages" class="secondary">app-pages リポジトリ</a>
    </div>

    <div class="note">
        <strong>運用メモ</strong>
        <ul style="margin: 10px 0 0 1.2em; padding: 0;">
            <li>形式は <a href="https://github.com/ninjya54/app-pages/blob/main/upscale-player/version.json">upscale-player/version.json</a> と同じです。</li>
            <li>リリース時は <code>ios.latestVersion</code> を Xcode のマーケティングバージョンに合わせる。</li>
            <li>App Store 公開後は <code>storeUrls.ios</code> にストア URL を入れる。</li>
        </ul>
    </div>

    <div class="back">
        <a href="../">← アプリ一覧へ</a>
    </div>
</body>

</html>
